<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#3a2f26" />
    <title>Arbol familiar</title>
  </head>
  <body>
    <p id="status" class="status">Cargando...</p>

    <div id="app" hidden>
      <header class="topbar">
        <div class="topbar__row">
          <h1 id="app-title" class="topbar__title">Arbol familiar</h1>
          <div id="search" class="search">
            <input
              id="search-input"
              class="search__input"
              type="search"
              placeholder="Buscar por nombre o apellido"
              autocomplete="off"
              spellcheck="false"
              aria-label="Buscar persona"
            />
            <div id="search-results" class="search__results" hidden></div>
          </div>
        </div>

        <div class="topbar__row topbar__row--controls">
          <div class="segmented" role="group" aria-label="Vista del arbol">
            <button type="button" class="segmented__btn" data-mode="desc" aria-pressed="false">Descendientes</button>
            <button type="button" class="segmented__btn" data-mode="asc" aria-pressed="false">Ascendientes</button>
            <button type="button" class="segmented__btn" data-mode="both" aria-pressed="true">Ambos</button>
          </div>

          <label class="gens">
            <span class="gens__label">Generaciones</span>
            <input id="generations" class="gens__input" type="range" min="1" max="8" step="1" value="4" />
            <output id="generations-value" class="gens__value">4</output>
          </label>

          <p class="topbar__current">Centrado en <strong id="current-person"></strong></p>
        </div>
      </header>

      <p id="truncation-notice" class="notice" hidden></p>

      <main id="viewport" class="viewport">
        <div id="pan" class="pan">
          <svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="zoom-controls">
          <button id="zoom-in" type="button" class="zoom-btn" aria-label="Acercar">+</button>
          <button id="zoom-out" type="button" class="zoom-btn" aria-label="Alejar">&minus;</button>
        </div>
      </main>

      <aside id="details" class="details" hidden aria-live="polite">
        <button type="button" class="details__close" aria-label="Cerrar ficha">&times;</button>
        <div class="details__body"></div>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
