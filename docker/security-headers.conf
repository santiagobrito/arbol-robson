# Cabeceras de seguridad.
#
# El sitio es indexable a proposito desde el 04-ago-2026: se quitaron el
# X-Robots-Tag y el meta robots. Si alguna vez hay que revertirlo, la linea era:
#   add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
#
# Se incluye en CADA location que declara su propio add_header: en nginx, un
# add_header dentro de un bloque anula TODOS los heredados del padre. Es la
# causa clasica de "puse la cabecera y no aparece".

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# La app es autocontenida: no carga nada de terceros. 'unsafe-inline' en style
# es necesario porque Topola inyecta el CSS del grafico dentro del SVG.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
