server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ---------- Acceso ----------
    # Lo genera el entrypoint segun PUBLIC_ACCESS: o pide usuario y contrasena,
    # o hace 'auth_basic off'. Va a nivel de servidor, de modo que cuando esta
    # activo cubre TODO: la web, el config.json y el propio GEDCOM. Las unicas
    # excepciones son /healthz y /robots.txt.
    include /tmp/runtime/auth.conf;

    include /etc/nginx/snippets/security-headers.conf;

    # El .ged sin comprimir son cientos de kB. Comprimido baja a un tercio, que
    # es la diferencia entre abrir en 4G o no abrir.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 1m;
    server_tokens off;

    # ---------- Excepciones sin autenticacion ----------

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        auth_basic off;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---------- Configuracion generada en el arranque ----------

    location = /config.json {
        alias /tmp/runtime/config.json;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ---------- GEDCOM desde el volumen ----------
    # Solo ficheros .ged con nombre sencillo. Cualquier otra cosa bajo /data/
    # no coincide y cae en el fallback de la SPA, asi que no hay listados ni
    # lectura accidental de otros ficheros del volumen.

    location ~ ^/data/(?<gedcom_file>[A-Za-z0-9._-]+\.ged)$ {
        alias /data/$gedcom_file;
        default_type text/plain;
        charset utf-8;
        include /etc/nginx/snippets/security-headers.conf;
        # El fichero se reemplaza sin reconstruir la imagen: no se cachea.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---------- Estaticos y SPA ----------

    # Vite pone hash en el nombre de cada asset, asi que se pueden cachear para
    # siempre sin riesgo de servir una version vieja.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: es quien apunta a los assets con hash.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
